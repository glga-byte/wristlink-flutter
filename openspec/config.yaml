schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Add custom guidance for specific operations.
# operations:
#   apply:
#     guidance:
#       - Run focused tests before the full suite
#       - Keep edits minimal and focused on the requested change
#   archive:
#     guidance:
#       - Keep the completion summary concise

operations:
  apply:
    guidance:
      - Work through tasks sequentially ONLY by delegating to subagents
      # - Review each completed task using a separate review subagent before checking off the list